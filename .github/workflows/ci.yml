name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Fetch google-services.json from VPS
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          if [ -z "$VPS_SSH_KEY" ] || [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ]; then
            echo "VPS_SSH_KEY/VPS_HOST/VPS_USER secrets are missing" >&2
            exit 1
          fi

          install -m 600 /dev/null "$RUNNER_TEMP/vps_ssh_key"
          echo "$VPS_SSH_KEY" > "$RUNNER_TEMP/vps_ssh_key"

          scp -i "$RUNNER_TEMP/vps_ssh_key" -o StrictHostKeyChecking=accept-new \
            "${VPS_USER}@${VPS_HOST}:/home/ubuntu/apps/scolive-mobile-secrets/google-services.json" \
            android/app/google-services.json

          rm -f "$RUNNER_TEMP/vps_ssh_key"

      - name: Android debug build
        run: npm run android:build:precommit
